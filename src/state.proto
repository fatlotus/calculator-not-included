message RowState {
  Entity entity = 1;
  oneof count {
    uint32 count_int = 2;
    double count_double = 3;
  }
  Recipe recipe = 4;
  Bathroom bathroom = 5;
  repeated Modifier modifiers = 6;
  optional double input_temp = 7;
  Food food = 8;
}

message NetTemperature {
  Element element = 1;
  StreamState state = 2;
  double temperature = 3;
}

message LoopedStream {
  Element element = 1;
  StreamState state = 2;
  double rate = 3;
  optional double temperature = 4;
}

message CalculatorState {
  RateMode rate_mode = 1;
  repeated RowState rows = 2;
  repeated NetTemperature net_temperatures = 3;
  repeated LoopedStream loops = 4;
}
